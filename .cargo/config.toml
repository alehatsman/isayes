# rust-quality — cargo config, copied to .cargo/config.toml by rq/sync-config.
#
# Cargo has a first-class mechanism for named commands, so the everyday ones
# live here rather than in a task runner: they work in a terminal, in CI, and in
# an editor, with no mooncake, no module fetch and no YAML.
#
# Presets are reserved for what an alias cannot do: multi-step gates with
# fail-fast ordering, and copying config into a consumer repo.

[alias]
lint = "clippy --locked --all-targets --all-features -- -D warnings"
# nextest never runs doctests. Two aliases rather than one that quietly skips.
t = "nextest run --locked --workspace --all-features"
doctest = "test --locked --doc --workspace --all-features"
docs = "doc --locked --no-deps --workspace --all-features"

[env]
# An alias cannot set an environment variable, so the strictness that makes
# `cargo docs` meaningful lives here — a broken intra-doc link now fails the
# command instead of scrolling past. Applies to the workspace only.
RUSTDOCFLAGS = "-D warnings"
