# rust-quality — shared cargo-deny policy.
#
# One tool, four policies. `advisories` is the RustSec feed; `bans`,
# `licenses` and `sources` matter because any dependency's build.rs runs on
# your machine at compile time.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add entries as `"RUSTSEC-0000-0000"` with a comment naming the ticket that
# tracks removal. An ignore without an expiry plan is a permanent hole.
ignore = []

[bans]
multiple-versions = "warn"   # informational; the fix is often upstream
wildcards = "deny"           # `version = "*"` defeats the lockfile
# Deny anything that pulls a second copy of a heavyweight tree.
# deny = [{ name = "openssl-sys", reason = "use rustls" }]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
